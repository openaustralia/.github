name: Bug report
description: Create a report to help us improve
title: "Bug: "
type: Bug
body:
  - type: dropdown
    id: service
    attributes:
      label: Which service is this about?
      options:
        - Planning Alerts
        - Right to Know
        - They Vote for You
        - OpenAustralia.org.au
        - morph.io
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see this for ourselves?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser, device, or OS (if relevant)
      placeholder: e.g. Safari on iPhone, Chrome on Windows 11
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: If applicable, add screenshots or console output to help explain your problem.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
    validations:
      required: false
